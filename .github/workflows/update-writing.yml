name: Update writing feed

on:
  schedule:
    - cron: '0 4 * * *'   # daily at 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest articles from Medium and DEV.to
        run: node scripts/fetch-writing.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/assets/data/writing.json; then
            echo "No writing changes."
            exit 0
          fi
          git add public/assets/data/writing.json
          git commit -m "chore: refresh writing feed"
          git push
